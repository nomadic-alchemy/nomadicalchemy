<meta charset="UTF-8">

<title>Cocktail Menu Consulting Quote | Nomadic Alchemy</title>
<meta name="description" content="Request a quote for cocktail menu design and drink program consulting for restaurants, hotels and venues in Kenya.">

</head>
<body>

<div class="page-body">
    <a class="back" href="index.html#services">Back to services</a>
    <h1 class="page-title">Let's build your menu</h1>
    <p class="page-sub">Tell us about your venue and we'll get back within 24 hours with a custom quote.</p>
    <p class="required-note">Fields marked * are required</p>

    <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="9837f6a8-35b7-4565-80e7-746e106ca202">
        <input type="hidden" name="subject" value="New cocktail menu consulting quote request">
        <input type="hidden" name="from_name" value="Nomadic Alchemy website">
        <input type="hidden" name="redirect" value="https://nomadicalchemy.co.ke/thank-you.html">
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="form-row">
            <div class="field">
                <label for="name">Your Name *</label>
                <input type="text" id="name" name="name" required autocomplete="name">
            </div>
            <div class="field">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
        </div>

        <div class="form-one field">
            <label for="phone">Phone / WhatsApp *</label>
            <div class="phone-field" data-phone>
                <select aria-label="Country" autocomplete="off" data-phone-country></select>
                <input type="tel" id="phone" inputmode="tel" autocomplete="tel-national" placeholder="712 345 678" required data-phone-number>
                <input type="hidden" name="phone" data-phone-full>
                <input type="hidden" name="phone_country" data-phone-country-name>
            </div>
        </div>

        <div class="form-row">
            <div class="field">
                <label for="business">Business Name *</label>
                <input type="text" id="business" name="business_name" required autocomplete="organization">
            </div>
            <div class="field">
                <label for="btype">Business Type *</label>
                <select id="btype" name="business_type" required>
                    <option value="">Select one</option>
                    <option>Restaurant</option>
                    <option>Hotel or lodge</option>
                    <option>Bar or lounge</option>
                    <option>Event venue</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="field">
                <label for="venue">Location *</label>
                <input type="text" id="venue" name="location" placeholder="e.g. Karen, Nairobi" required>
            </div>
            <div class="field">
                <label for="stage">What You Need *</label>
                <select id="stage" name="project_type" required>
                    <option value="">Select one</option>
                    <option>A menu for a new concept</option>
                    <option>A refresh of our current menu</option>
                    <option>A seasonal or special menu</option>
                    <option>A full drink program with staff training</option>
                    <option>Not sure yet</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="field">
                <label for="count">Cocktails on the Menu</label>
                <select id="count" name="menu_size">
                    <option value="">Not sure yet</option>
                    <option>4 to 6</option>
                    <option>7 to 10</option>
                    <option>11 or more</option>
                </select>
            </div>
            <div class="field">
                <label for="eventDate">Target Launch Date</label>
                <input type="date" id="eventDate" name="target_launch" onclick="this.showPicker()">
            </div>
        </div>

        <div class="form-row">
            <div class="field">
                <label for="team">Bar Team Size</label>
                <input type="text" id="team" name="bar_team_size" placeholder="e.g. 4 bartenders">
            </div>
            <div class="field">
                <label for="budget">Budget</label>
                <input type="text" id="budget" name="budget" placeholder="A range, if you have one">
            </div>
        </div>

        <div class="form-one field" style="margin-bottom: 30px;">
            <label for="message">Tell Us More</label>
            <textarea id="message" name="message" placeholder="Your concept, your crowd, what is and is not working on the current menu..." style="height: 100px;"></textarea>
        </div>

        <button type="submit" class="submit-btn">Request a quote</button>
    </form>

    <p class="ux-note">Prefer WhatsApp? Tap below and press send to start the conversation.</p>

        CONTINUE ON WHATSAPP
    </a>
</div>

    var d = document.getElementById('eventDate');
